name: Release

# Builds macOS (Apple Silicon and Intel), Windows and Linux installers and attaches them
# to a draft GitHub release named after the version in tauri.conf.json.
# Trigger: push a tag matching that version (git tag v0.4.1 && git push origin v0.4.1),
# or run it from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            llama-features: --features metal
          # Intel Macs. The llama helper runs on the CPU there: llama.cpp's Metal
          # backend is slow or unreliable on Intel and AMD Mac GPUs.
          - name: macOS (Intel)
            os: macos-15-intel
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
            llama-features: ""
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: --features vulkan
            # Uses a dedicated GPU when there is one, the CPU otherwise
            llama-features: --features vulkan
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --features openblas --bundles deb,appimage
            llama-features: ""

    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' frontend/src-tauri/tauri.conf.json | cut -d'"' -f4)
          if [[ "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match tauri.conf.json version v${VERSION}"
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libopenblas-dev libx11-dev libxtst-dev libxrandr-dev

      # llama.cpp's bundled cpp-httplib doesn't compile against OpenSSL 4,
      # which the macOS runner now ships; point CMake at OpenSSL 3 instead.
      - name: Use OpenSSL 3
        if: runner.os == 'macOS'
        run: |
          # Build for macOS 13 (Ventura) and later, not just the runner's own version.
          echo "MACOSX_DEPLOYMENT_TARGET=13.0" >> "$GITHUB_ENV"
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          PREFIX=$(brew --prefix openssl@3)
          echo "OPENSSL_ROOT_DIR=$PREFIX" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"

      # llama.cpp's Vulkan shader generator fails to build with the runner's CMake 4.4
      # ("Not a file: .../vulkan-shaders-gen-build/cmake_install.cmake"). 4.2 is the
      # oldest CMake that knows Visual Studio 2026.
      - name: Use CMake 4.2
        if: runner.os == 'Windows'
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "4.2.8"

      - name: Install Vulkan SDK
        if: runner.os == 'Windows'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      # Builds Whisper for a baseline x86-64-v2 CPU so the app runs on machines
      # without AVX2, and verifies the result before bundling.
      - name: Configure portable Windows build
        id: windows-portability
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cmakeHook = (Join-Path $env:GITHUB_WORKSPACE ".github/force-portable-ggml.cmake").Replace('\', '/')
          "CMAKE_PROJECT_INCLUDE=$cmakeHook" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RUSTFLAGS=-C target-cpu=x86-64-v2" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $configPath = (Join-Path $env:RUNNER_TEMP "tauri.windows-portable.conf.json").Replace('\', '/')
          @{
            build = @{
              beforeBundleCommand = @{
                script = "node .github/verify-portable-ggml.cjs target/release"
                cwd = $env:GITHUB_WORKSPACE
              }
            }
          } | ConvertTo-Json -Depth 4 | Set-Content -Path $configPath -Encoding utf8
          "args=--config `"$configPath`"" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build llama-helper sidecar
        shell: bash
        run: |
          cargo build --release -p llama-helper ${{ matrix.llama-features }}
          mkdir -p frontend/src-tauri/binaries
          EXT=""; [[ "$RUNNER_OS" == "Windows" ]] && EXT=".exe"
          cp "target/release/llama-helper${EXT}" "frontend/src-tauri/binaries/llama-helper-${{ matrix.target }}${EXT}"

      - name: Build and upload to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEGRA_GOOGLE_CLIENT_ID: ${{ secrets.SEGRA_GOOGLE_CLIENT_ID }}
          SEGRA_GOOGLE_CLIENT_SECRET: ${{ secrets.SEGRA_GOOGLE_CLIENT_SECRET }}
        with:
          projectPath: frontend
          tagName: v__VERSION__
          releaseName: Segra Meetings v__VERSION__
          releaseBody: Download the installer for your platform below.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }} ${{ steps.windows-portability.outputs.args }}
